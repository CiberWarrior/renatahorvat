const STAR_TRAVEL=7.4,DOC_TRAVEL=2.45,DOC_STAGGER=.95,targets=[{x:642,y:177},{x:775,y:230},{x:700,y:310},{x:852,y:307},{x:786,y:404}],arrivals=Array.from({length:5},(_,g)=>.35+g*3*.55+STAR_TRAVEL),endTime=.35+14*.55+STAR_TRAVEL+1.4+.7;let frame,particles=[],elapsed=0,lastTime=0;

function makeParticle(i){const group=Math.floor(i/3),lane=i%3,node=document.createElementNS(ns,'g'),shape=document.createElementNS(ns,'use');node.classList.add('star-particle');shape.setAttribute('href','#rh-star');const halo=document.createElementNS(ns,'circle');halo.classList.add('star-halo');halo.setAttribute('r','22');halo.setAttribute('fill','url(#rh-polish-halo)');node.append(halo,shape);node.style.opacity=0;inside.append(node);return{node,group,lane,delay:.35+i*.55,size:.8+lane*.04,rotates:i%2===1};}
const inputFan=[{x:42,y:28,angle:-14},{x:88,y:7,angle:5},{x:138,y:30,angle:14},{x:151,y:44,angle:9}];
const inputIdeas=[...inputGroup.querySelectorAll('.input-idea')].map((node,i)=>({node,...inputFan[i],delay:i*DOC_STAGGER}));
function drawInputs(t,staticView=false){for(const [i,item] of inputIdeas.entries()){const age=t-item.delay;if(staticView||age<0){item.node.style.opacity='1';item.node.setAttribute('transform','translate('+item.x+' '+item.y+') rotate('+item.angle+') scale(1.35)');continue}const u=clamp(age/DOC_TRAVEL),v=Math.pow(u,1.12),q=1-v,endX=90+(i%2===0?-4:4),cx=item.x+(endX-item.x)*.18,cy=item.y+30,x=q*q*q*item.x+3*q*q*v*cx+3*q*v*v*endX+v*v*v*endX,y=q*q*q*item.y+3*q*q*v*cy+3*q*v*v*45+v*v*v*98,scale=1.35-.43*v,angle=item.angle*(1-.65*v)+Math.sin(Math.PI*v)*5*(i%2===0?1:-1);item.node.style.opacity=u>=1?'0':'1';item.node.setAttribute('transform','translate('+x.toFixed(2)+' '+y.toFixed(2)+') rotate('+angle.toFixed(1)+') scale('+scale.toFixed(3)+')');}}
const umbrellas=[...root.querySelectorAll('.umbrella')].map(node=>({phase:Number(node.dataset.phase),canopy:node.querySelector('.canopy'),ribs:node.querySelector('.ribs')}));
function drawUmbrellas(t,settled=false){for(const umbrella of umbrellas){const phase=umbrella.phase,end=endTime;let open=settled?1:(.5-.5*Math.cos((t+phase)*Math.PI*2/5.6));if(t>end-2){const blend=ease(clamp((t-(end-2))/2));open+= (1-open)*blend;}const w=5+30*open,y=20*(1-open),inner=w/3,peak=-32;
umbrella.canopy.setAttribute('d',`M${-w} ${y} Q${-w*.65} ${peak} 0 ${peak} Q${w*.65} ${peak} ${w} ${y} Q${w*.67} ${y-10*open} ${inner} ${y} Q0 ${y-12*open} ${-inner} ${y} Q${-w*.67} ${y-10*open} ${-w} ${y}Z`);
umbrella.ribs.setAttribute('d',`M0 ${peak} Q${-inner} ${peak+13} ${-inner} ${y} M0 ${peak} Q${inner} ${peak+13} ${inner} ${y}`);}}
const outline=root.querySelector('.web-outline'),gauge=root.querySelector('.gauge-pointer'),microNeedles=[...root.querySelectorAll('.micro-needle')],outletEcho=root.querySelector('.outlet-echo'),arrivalEchoes=[...root.querySelectorAll('.arrival-echo')];
function echo(node,age,duration,strength){const u=clamp(age/duration),visible=age>=0&&age<duration;node.style.opacity=visible?String(strength*Math.sin(Math.PI*u)):0;node.style.transform=`scale(${.6+u*.9})`;}
function drawEchoes(t){let latest=-10;for(const particle of particles){const age=t-particle.delay-STAR_TRAVEL;if(age>=0)latest=age;}echo(outletEcho,latest,.5,.42);arrivalEchoes.forEach((node,i)=>echo(node,t-arrivals[i]-.85,.7,.36));}
const wheels=[...root.querySelectorAll('.working')].map(node=>({node,duration:node.classList.contains('gear-main')?12:node.classList.contains('gear-small')?9:node.classList.contains('gear-tiny')?7:10,direction:node.classList.contains('reverse')?-1:1}));
wheels.forEach(w=>w.node.style.animation='none');
function drawWheels(t){const duration=2.4,brake=endTime-duration,u=clamp((t-brake)/duration),clock=t<=brake?t:brake+duration*(u-u*u+u*u*u/3);wheels.forEach(w=>w.node.setAttribute('transform',`rotate(${w.direction*360*clock/w.duration})`));}
function start(){scene.classList.remove('prepared');root.classList.remove('input-ready');cancelAnimationFrame(frame);outletEcho.style.opacity=0;arrivalEchoes.forEach(node=>node.style.opacity=0);elapsed=0;lastTime=0;outline.style.strokeDashoffset="1";drawWheels(0);container.replaceChildren();inside.replaceChildren();parts.forEach(p=>p.classList.remove('show'));scene.classList.remove('finished');scene.classList.add('active');if(reduced.matches||mobile.matches){finish();return}root.classList.add('input-ready');drawInputs(0,true);particles=Array.from({length:15},(_,i)=>makeParticle(i));frame=requestAnimationFrame(tick);}
function tick(now){if(!lastTime)lastTime=now;if(!document.hidden)elapsed+=Math.min((now-lastTime)/1000,.06);lastTime=now;const t=elapsed;drawInputs(t);microNeedles.forEach((needle,i)=>needle.setAttribute('transform','rotate('+((t*[32,44,56,92][i])%360)+')'));drawWheels(t);drawEchoes(t);outline.style.strokeDashoffset=String(1-clamp((t-arrivals[0])/1.25));drawUmbrellas(t);gauge.setAttribute("transform",`rotate(${-3+15*Math.sin(t*Math.PI/5)})`);
for(const {node,group,lane,delay,size,rotates} of particles){const age=t-delay;if(age<0){node.style.opacity=0;continue}let x,y,opacity=1,scale=size;const travel=STAR_TRAVEL;
if(age<travel){const u=clamp(age/travel),speed=u,p=pathSamples[Math.round(clamp(speed)*700)];x=p.x;y=p.y;opacity=clamp(age/.2);}
else{const release=delay+travel,arrival=release+1.4,u=clamp((t-release)/(arrival-release)),v=ease(u),target=targets[group],spread=Math.sin(Math.PI*u),angle=lane/3*Math.PI*2;
x=608+(target.x-608)*v+Math.cos(angle)*spread*14;y=240+(target.y-240)*v+Math.sin(angle)*spread*20-24*Math.sin(Math.PI*u);scale=size*(1+.08*spread)*(1-.7*Math.pow(u,5));opacity=1-Math.pow(u,8);}
node.style.opacity=opacity;node.setAttribute('transform',`translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${(rotates?age*28:0).toFixed(1)}) scale(${scale.toFixed(3)})`);}
parts.forEach((part,i)=>{if(t>=arrivals[i])part.classList.add('show')});if(t<endTime)frame=requestAnimationFrame(tick);else finish();}
function finish(){scene.classList.remove('prepared');root.classList.remove('input-ready');drawInputs(endTime);cancelAnimationFrame(frame);outletEcho.style.opacity=0;arrivalEchoes.forEach(node=>node.style.opacity=0);outline.style.strokeDashoffset="0";if(!reduced.matches)drawWheels(endTime);drawUmbrellas(0,true);gauge.setAttribute("transform","rotate(-8)");container.replaceChildren();inside.replaceChildren();parts.forEach(p=>p.classList.add('show'));scene.classList.remove('active');scene.classList.add('finished');}
reduced.addEventListener('change',start);
mobile.addEventListener('change',start);
document.addEventListener('visibilitychange',()=>{lastTime=0;scene.style.animationPlayState=document.hidden?'paused':'';root.querySelectorAll('.working,.wobble,.lamp,.needle,.ecg-trace,.tech-light,.rocket-flame,.gauge-pointer').forEach(el=>el.style.animationPlayState=document.hidden?'paused':'');});
if(reduced.matches||mobile.matches)finish();else{root.classList.add('input-ready');drawInputs(0,true);drawUmbrellas(0);scene.classList.add('prepared');const observer=new IntersectionObserver(entries=>{if(entries.some(entry=>entry.isIntersecting)){observer.disconnect();start();}},{threshold:.2});observer.observe(root);}
root.dataset.heroReady='true';
root.style.removeProperty('visibility');

}
</script>

</main>
<script>document.getElementById('replay').addEventListener('click',()=>location.reload());</script>
